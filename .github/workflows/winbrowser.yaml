name: WinBrowser

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-winbrowser:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-icu

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WINBROWSER_ONLY=ON \
            -DMARCH_NATIVE=OFF

      - name: Build
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! cmake --build build --target winbrowser --parallel > build.log 2>&1; then
            tail -n 200 build.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winbrowser-build-log
          path: build.log

      - name: Prepare artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/winbrowser.exe dist/winbrowser.exe

          for dll in $(objdump -p build/winbrowser.exe | awk '/DLL Name:/ { print $3 }'); do
            if [ -f "$MINGW_PREFIX/bin/$dll" ]; then
              cp "$MINGW_PREFIX/bin/$dll" dist/
            fi
          done

          cat > dist/README-winbrowser.txt <<'EOF'
          Native Windows GUI build of the Usenet Archive Browser.

          Run:
            winbrowser.exe <archive-path>

          You can also launch it without arguments and use File -> Open.

          Keep the DLL files from this archive in the same folder as winbrowser.exe.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: winbrowser-windows-x64
          path: dist
