name: WinBrowser Release

on:
  push:
    tags:
      - 'winbrowser-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to package and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  TARGET_RELEASE_REPO: michaldziwisz/winbrowser

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-icu

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WINBROWSER_ONLY=ON \
            -DMARCH_NATIVE=OFF

      - name: Build
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! cmake --build build --target winbrowser --parallel > build.log 2>&1; then
            tail -n 200 build.log
            exit 1
          fi

      - name: Prepare release package
        shell: msys2 {0}
        run: |
          mkdir -p release/winbrowser-windows-x64
          cp build/winbrowser.exe release/winbrowser-windows-x64/winbrowser.exe

          for dll in $(objdump -p build/winbrowser.exe | awk '/DLL Name:/ { print $3 }'); do
            if [ -f "$MINGW_PREFIX/bin/$dll" ]; then
              cp "$MINGW_PREFIX/bin/$dll" release/winbrowser-windows-x64/
            fi
          done

          cat > release/winbrowser-windows-x64/README-winbrowser.txt <<'EOF'
          Native Windows GUI build of the Usenet Archive Browser.

          Run:
            winbrowser.exe <archive-path>

          You can also launch it without arguments and use File -> Open.

          Keep the DLL files from this archive in the same folder as winbrowser.exe.
          EOF

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/winbrowser-windows-x64/* `
            -DestinationPath release/winbrowser-windows-x64.zip `
            -Force

      - uses: actions/upload-artifact@v4
        with:
          name: winbrowser-release-assets
          path: |
            release/winbrowser-windows-x64.zip
            release/winbrowser-windows-x64/README-winbrowser.txt

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: winbrowser-release-assets
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum winbrowser-windows-x64.zip > SHA256SUMS.txt

      - name: Build release notes
        run: |
          CURRENT_TAG="${RELEASE_TAG}"
          VERSION="${CURRENT_TAG#winbrowser-v}"
          PREVIOUS_TAG="$(git tag --list 'winbrowser-v*' --sort=-version:refname | grep -Fxv "${CURRENT_TAG}" | head -n1 || true)"

          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
            RANGE_LABEL="${PREVIOUS_TAG}..${CURRENT_TAG}"
          else
            RANGE="origin/master..${CURRENT_TAG}"
            RANGE_LABEL="origin/master..${CURRENT_TAG}"
          fi

          {
            echo "# WinBrowser ${VERSION}"
            echo
            echo "Windows release package for the accessible `winbrowser` GUI."
            echo
            echo "## Source"
            echo "- Source repository: https://github.com/${GITHUB_REPOSITORY}"
            echo "- Source tag: \`${CURRENT_TAG}\`"
            echo "- Release range: \`${RANGE_LABEL}\`"
            echo
            echo "## Changes"
            git log --first-parent --format='- %s' "${RANGE}"
            echo
            echo "## Package"
            echo "- \`winbrowser-windows-x64.zip\`"
            echo "- \`SHA256SUMS.txt\`"
            echo
            echo "## Notes"
            echo "- Archives distributed as \`*.xz\` need to be unpacked before opening in \`winbrowser\`."
            echo "- Source code stays in the Usenet Archive fork; this repository is the Windows release channel."
          } > release/release-notes.md

      - name: Publish GitHub release to distribution repo
        env:
          GH_TOKEN: ${{ secrets.WINBROWSER_RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "WINBROWSER_RELEASE_REPO_TOKEN secret is not configured."
            exit 1
          fi

          TITLE="WinBrowser ${RELEASE_TAG#winbrowser-v}"
          DEFAULT_BRANCH="$(gh api repos/${TARGET_RELEASE_REPO} --jq '.default_branch')"
          TARGET_SHA="$(gh api repos/${TARGET_RELEASE_REPO}/git/ref/heads/${DEFAULT_BRANCH} --jq '.object.sha')"
          TAG_OBJECT_SHA="$(
            gh api \
              --method POST \
              repos/${TARGET_RELEASE_REPO}/git/tags \
              -f tag="${RELEASE_TAG}" \
              -f message="${TITLE}" \
              -f object="${TARGET_SHA}" \
              -f type="commit" \
              --jq '.sha'
          )"

          if gh api repos/${TARGET_RELEASE_REPO}/git/ref/tags/${RELEASE_TAG} >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              repos/${TARGET_RELEASE_REPO}/git/refs/tags/${RELEASE_TAG} \
              -f sha="${TAG_OBJECT_SHA}" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              repos/${TARGET_RELEASE_REPO}/git/refs \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${TAG_OBJECT_SHA}" >/dev/null
          fi

          if gh release view "${RELEASE_TAG}" --repo "${TARGET_RELEASE_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              release/winbrowser-windows-x64.zip \
              release/SHA256SUMS.txt \
              --repo "${TARGET_RELEASE_REPO}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${TARGET_RELEASE_REPO}" \
              --title "${TITLE}" \
              --notes-file release/release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              release/winbrowser-windows-x64.zip \
              release/SHA256SUMS.txt \
              --repo "${TARGET_RELEASE_REPO}" \
              --title "${TITLE}" \
              --notes-file release/release-notes.md \
              --latest
          fi
