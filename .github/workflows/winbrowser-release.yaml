name: WinBrowser Release

on:
  push:
    tags:
      - 'winbrowser-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-icu

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WINBROWSER_ONLY=ON \
            -DMARCH_NATIVE=OFF

      - name: Build
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! cmake --build build --target winbrowser --parallel > build.log 2>&1; then
            tail -n 200 build.log
            exit 1
          fi

      - name: Prepare release package
        shell: msys2 {0}
        run: |
          mkdir -p release/winbrowser-windows-x64
          cp build/winbrowser.exe release/winbrowser-windows-x64/winbrowser.exe

          for dll in $(objdump -p build/winbrowser.exe | awk '/DLL Name:/ { print $3 }'); do
            if [ -f "$MINGW_PREFIX/bin/$dll" ]; then
              cp "$MINGW_PREFIX/bin/$dll" release/winbrowser-windows-x64/
            fi
          done

          cat > release/winbrowser-windows-x64/README-winbrowser.txt <<'EOF'
          Native Windows GUI build of the Usenet Archive Browser.

          Run:
            winbrowser.exe <archive-path>

          You can also launch it without arguments and use File -> Open.

          Keep the DLL files from this archive in the same folder as winbrowser.exe.
          EOF

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/winbrowser-windows-x64/* `
            -DestinationPath release/winbrowser-windows-x64.zip `
            -Force

      - uses: actions/upload-artifact@v4
        with:
          name: winbrowser-release-assets
          path: |
            release/winbrowser-windows-x64.zip
            release/winbrowser-windows-x64/README-winbrowser.txt

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winbrowser-release-assets
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum winbrowser-windows-x64.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          Windows GUI build of winbrowser.

          Package contents:
          - winbrowser.exe
          - required MinGW runtime DLL files
          - README-winbrowser.txt

          Note:
          - archives distributed as *.xz need to be unpacked before opening in winbrowser
          EOF
          )

          gh release create "${GITHUB_REF_NAME}" \
            release/winbrowser-windows-x64.zip \
            release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "WinBrowser ${GITHUB_REF_NAME#winbrowser-v}" \
            --generate-notes \
            --notes "${NOTES}" \
            --verify-tag
